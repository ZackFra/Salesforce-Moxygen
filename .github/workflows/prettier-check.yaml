name: Check Prettier

on:
    workflow_call:

jobs:
    prettier-check:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '22'
            - name: Checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: Install Dependencies
              run: npm ci
            - name: Run Prettier Check
              run: npm run prettier:verify